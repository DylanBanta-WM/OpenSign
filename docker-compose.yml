services:
  server:
    image: westm-opensignserver:latest
    restart: unless-stopped
    container_name: OpenSignServer-container
    volumes:
      - ./Volumes/opensign-files:/usr/src/app/files
      - ./choose_password:/usr/src/app/node_modules/parse-server/views/choose_password
      - ./apps/OpenSignServer/files/setup_email.html:/usr/src/app/files/setup_email.html
      - ./apps/OpenSignServer/files/setup_email.txt:/usr/src/app/files/setup_email.txt
      - ./apps/OpenSignServer/files/setup_email_subject.txt:/usr/src/app/files/setup_email_subject.txt
      - ./apps/OpenSignServer/files/reminder_email.html:/usr/src/app/files/reminder_email.html
      - ./apps/OpenSignServer/files/reminder_email.txt:/usr/src/app/files/reminder_email.txt
      - ./apps/OpenSignServer/files/reminder_email_subject.txt:/usr/src/app/files/reminder_email_subject.txt
      - ./apps/OpenSignServer/index.js:/usr/src/app/index.js
      - ./apps/OpenSignServer/cloud/main.js:/usr/src/app/cloud/main.js
      - ./apps/OpenSignServer/cloud/parsefunction/updateTenant.js:/usr/src/app/cloud/parsefunction/updateTenant.js
      - ./apps/OpenSignServer/cloud/parsefunction/sendReminderEmail.js:/usr/src/app/cloud/parsefunction/sendReminderEmail.js
    ports:
      - "8082:8080"
    depends_on:
      mongo:
        condition: service_healthy
    env_file: .env.prod
    environment:
      - NODE_ENV=production
      - SERVER_URL=https://sign.westmschools.com/api/app
      - PUBLIC_URL=https://sign.westmschools.com
    networks:
      - app-network
  mongo:
    image: mongo:latest
    restart: unless-stopped
    container_name: mongo-container
    volumes:
      - ./Volumes/mongo-data:/data/db
    # ports:
    #   - "27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - app-network
  client:
    image: westm-opensign:latest
    restart: unless-stopped
    container_name: OpenSign-container
    depends_on:
      - server
    env_file: .env.prod  
    ports:
      - "3000:3000"
    networks:
      - app-network
  # caddy:
  #   image: caddy:latest
  #   restart: unless-stopped
  #   container_name: caddy-container
  #   ports:
  #     - "3001:3001"
  #     - "80:80"
  #     - "443:443"
  #     - "443:443/udp"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile
  #     - caddy_data:/data
  #     - caddy_config:/config
  #   networks:
  #     - app-network
  #   environment:
  #     - HOST_URL=${HOST_URL:-localhost:3001}
networks:
  app-network:
    driver: bridge

