<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body style="margin: 0; padding: 0; background-color: #f4f4f4; font-family: Arial, sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #f4f4f4;">
    <tr>
      <td align="center" style="padding: 20px 0;">
        <table width="600" cellpadding="0" cellspacing="0" style="background-color: #ffffff; border-radius: 8px; overflow: hidden;">
          <tr>
            <td style="background-color: #003087; padding: 20px 30px;">
              <img src="https://sign.westmschools.com/static/js/assets/images/logo-dark.png" alt="OpenSign" style="height: 60px; max-width: 300px;" />
            </td>
          </tr>
          <tr>
            <td style="padding: 30px;">
              <p style="font-size: 16px; color: #333;">Welcome to OpenSign!</p>
              <p style="font-size: 15px; color: #555;">Your account has been created by your administration. Click the button below to set your password and get started.</p>
              <br />
              <p style="text-align: center;">
                <a href="{{{link}}}" style="background-color: #003087; color: #ffffff; padding: 12px 24px; border-radius: 5px; text-decoration: none; font-size: 15px; font-weight: bold;">Set Your Password</a>
              </p>
              <br />
              <p style="font-size: 13px; color: #999;">If you did not expect this email, please contact your system administrator.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
